# MAA 全托管执行面（默认不启）。在 R730XD 上一键启用：
#   sudo bash scripts/install-maa-host.sh
# 详见 docs/maa-ops.md
#
# 之后：binder 开机自动加载；Worker 随 compose 启动；Watchtower 拉 GHCR 新镜像。

services:
  maa-worker:
    profiles: ["maa"]
    image: ${MAA_WORKER_IMAGE:-ghcr.io/739790797/zhange-stats-maa-worker}:${MAA_WORKER_TAG:-latest}
    build:
      context: ./maa-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MAA_APP_BASE_URL: ${MAA_APP_BASE_URL:-http://app:8000}
      # MAA_WORKER_TOKEN / SECRET_KEY 只从 env_file 注入。
      # 勿写成 ${VAR:-}：宿主机未 export 时会变成空串并覆盖 .env。
      DATA_DIR: /app/data
      MAA_DOCKER_NETWORK: ${MAA_DOCKER_NETWORK:-zhange-stats_maa}
      MAA_REDROID_IMAGE: ${MAA_REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
      MAA_WORKER_POLL_SEC: ${MAA_WORKER_POLL_SEC:-5}
      MAA_SCREENSHOT_INTERVAL_SEC: ${MAA_SCREENSHOT_INTERVAL_SEC:-3}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - maa
    labels:
      # 与 app 一样由 Watchtower 跟随 GHCR latest/钉版本
      com.centurylinklabs.watchtower.enable: "true"

  # PoC / 手工验证用静态 Redroid（可选）。生产槽位由 maa-worker 动态创建。
  redroid-poc:
    profiles: ["maa"]
    image: ${MAA_REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
    privileged: true
    restart: unless-stopped
    volumes:
      - redroid-poc-data:/data
    networks:
      - maa
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_fps=30
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      zhange.maa.poc: "1"

networks:
  maa:
    name: zhange-stats_maa
    driver: bridge

volumes:
  redroid-poc-data:
