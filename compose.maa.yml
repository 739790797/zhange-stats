# MAA 全托管执行面（可选；与 LXC 控制面解耦）。
# 控制面用 scripts/install.sh 裸跑；本文件仅拉起 Worker + 可选 Redroid PoC。
#   sudo bash scripts/install-maa-host.sh
# 详见 docs/maa-ops.md
#
# 镜像需自行 docker build（主线 CI 不再推 GHCR）：
#   docker compose -f compose.maa.yml --profile maa build

services:
  maa-worker:
    profiles: ["maa"]
    image: ${MAA_WORKER_IMAGE:-zhange-stats-maa-worker}:${MAA_WORKER_TAG:-local}
    build:
      context: ./maa-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # LXC 控制面在宿主机时默认走 host.docker.internal
      MAA_APP_BASE_URL: ${MAA_APP_BASE_URL:-http://host.docker.internal:8000}
      # MAA_WORKER_TOKEN / SECRET_KEY 只从 env_file 注入。
      # 勿写成 ${VAR:-}：宿主机未 export 时会变成空串并覆盖 .env。
      DATA_DIR: /app/data
      MAA_DOCKER_NETWORK: ${MAA_DOCKER_NETWORK:-zhange-stats_maa}
      MAA_REDROID_IMAGE: ${MAA_REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
      MAA_WORKER_POLL_SEC: ${MAA_WORKER_POLL_SEC:-5}
      MAA_SCREENSHOT_INTERVAL_SEC: ${MAA_SCREENSHOT_INTERVAL_SEC:-3}
    volumes:
      - ./data:/app/data
      - maa-cli-data:/var/lib/maa
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - maa

  # PoC / 手工验证用静态 Redroid（可选）。生产槽位由 maa-worker 动态创建。
  redroid-poc:
    profiles: ["maa"]
    image: ${MAA_REDROID_IMAGE:-redroid/redroid:11.0.0-latest}
    privileged: true
    restart: unless-stopped
    volumes:
      - redroid-poc-data:/data
    networks:
      - maa
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_fps=30
    labels:
      zhange.maa.poc: "1"

networks:
  maa:
    name: zhange-stats_maa
    driver: bridge

volumes:
  redroid-poc-data:
  maa-cli-data:
