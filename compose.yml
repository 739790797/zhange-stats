# 战鸽数据 · 仅运行应用容器（MySQL 请自备）
# 复制 .env.example → .env，填好 DATABASE_URL 后：
#   docker compose pull && docker compose up -d
# 也可用 docker run（见 README）；compose 只是方便挂载目录与环境变量。

name: zhange-stats

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/739790797/zhange-stats}:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.4}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      # APP_VERSION 以镜像为准，勿用宿主机变量覆盖
      STATIC_DIR: /app/static
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      UPDATE_ENABLED: ${UPDATE_ENABLED:-false}
      UPDATE_REPO: ${UPDATE_REPO:-739790797/zhange-stats}
      UPDATE_IMAGE: ${APP_IMAGE:-ghcr.io/739790797/zhange-stats}
      UPDATE_COMPOSE_FILE: /deploy/compose.yml
      UPDATE_COMPOSE_SERVICE: app
      UPDATE_COMPOSE_PROJECT: zhange-stats
    extra_hosts:
      # 便于 DATABASE_URL 使用 host.docker.internal 访问宿主机上的 MySQL
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/uploads
      # 启用管理端「系统更新」时取消下面三行注释，并设 UPDATE_ENABLED=true
      # 警告：挂载 docker.sock 等于把宿主机 Docker 管理权交给容器内管理员操作
      # - /var/run/docker.sock:/var/run/docker.sock
      # - ./compose.yml:/deploy/compose.yml:ro
      # - ./.env:/deploy/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
