# 战鸽数据 · 应用 + Watchtower 自动更新（MySQL 请自备）
# 复制 .env.example → .env，填好 DATABASE_URL 后：
#   docker compose pull && docker compose up -d
#
# 发版后 CI 推送 GHCR :latest；Watchtower 定时检测并自动拉取重建 app。
# 请保持单 app 副本（调度/迁移/进程锁非多实例安全）；详见 README「部署形态」。
# app 镜像 all-in-one：同容器内嵌 Redis（127.0.0.1，限流 + 扫码/cred 短时 KV）。
#
# MAA 全托管执行面（Redroid + Worker）见 compose.maa.yml，默认不启。
# 生产机若只有旧目录：先从最新 app 镜像导出宿主机文件，再一键安装：
#   docker run --rm -v "$PWD:/host" ghcr.io/739790797/zhange-stats:latest \
#     /bin/sh /app/maa-host/scripts/export-to-host.sh
#   sudo bash scripts/install-maa-host.sh
# 详见 docs/maa-ops.md。app 不挂 docker.sock、不 privileged。

name: zhange-stats

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/739790797/zhange-stats}:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.2.15}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      # APP_VERSION 以镜像为准，勿用宿主机变量覆盖
      STATIC_DIR: /app/static
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      # 镜像默认已内嵌 Redis；若 .env 覆盖了 REDIS_URL 指向外部，入口会跳过本机 redis
      EMBEDDED_REDIS: ${EMBEDDED_REDIS:-1}
    labels:
      # 仅允许 Watchtower 管理本服务
      com.centurylinklabs.watchtower.enable: "true"
    extra_hosts:
      # 便于 DATABASE_URL 使用 host.docker.internal 访问宿主机上的 MySQL
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # 把镜像内 /app/maa-host 导出到当前 compose 工程目录（不启业务）
  maa-host-export:
    profiles: ["maa-export"]
    image: ${APP_IMAGE:-ghcr.io/739790797/zhange-stats}:${APP_TAG:-latest}
    volumes:
      - ./:/host
    entrypoint: ["/bin/sh", "/app/maa-host/scripts/export-to-host.sh"]
    command: ["/host"]
    restart: "no"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  watchtower:
    image: nickfedor/watchtower:1.12.3
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 若 GHCR 镜像仍为私有，取消下一行并先在宿主机 docker login ghcr.io
      # - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # 默认每 5 分钟检查一次；可用 .env 覆盖
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      # DOCKER_CONFIG: /config
    # 不监控自己（无 enable 标签）
    labels:
      com.centurylinklabs.watchtower.enable: "false"
