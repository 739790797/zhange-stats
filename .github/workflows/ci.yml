name: CI and release

# PR：质量门。main 推送：同门 + 按 VERSION 发 GitHub Release（预构建 static）。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & lint & test & build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run test
          npm run build

      - name: Upload frontend dist (main only)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install & test
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

  # 生产是 MariaDB：用同引擎跑 alembic，拦住 CAST(... AS JSON) 等方言坑
  backend-migrate-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zhange_ci
          MYSQL_USER: zhange
          MYSQL_PASSWORD: zhange
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Alembic upgrade head (twice for idempotency)
        working-directory: backend
        env:
          DATABASE_URL: "mysql+pymysql://zhange:zhange@127.0.0.1:3306/zhange_ci"
          SECRET_KEY: "ci-mariadb-migrate-check-not-for-prod"
          APP_ENV: "development"
          ALLOW_ENV_ADMIN_SEED: "false"
        run: |
          python <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_settings
          from app.core.migrate import run_migrations

          get_settings.cache_clear()
          run_migrations()
          print("upgrade-1-ok")
          get_settings.cache_clear()
          run_migrations()
          print("upgrade-2-ok")
          s = get_settings()
          with create_engine(s.DATABASE_URL).connect() as conn:
              rev = conn.execute(text("SELECT version_num FROM alembic_version")).scalar()
          print("rev", rev)
          assert rev, "alembic_version empty"
          PY

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export OpenAPI & check drift
        env:
          DATABASE_URL: "mysql+pymysql://ci:ci@127.0.0.1:3306/ci"
          SECRET_KEY: "ci-openapi-drift-check-not-for-prod-use-only"
          ADMIN_PASSWORD: "ci-strong-password-9"
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci --legacy-peer-deps && cd ..
          python backend/scripts/export_openapi.py
          cd frontend && npm run gen:api
          git diff --exit-code -- frontend/src/api/generated/openapi.json frontend/src/api/generated/schema.d.ts

  publish-release:
    needs: [frontend-quality, backend-tests, backend-migrate-mariadb, openapi-drift]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"

      - name: Download frontend dist
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Pack static asset
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          tar -C frontend/dist -czf "zhange-stats-${VERSION}-static.tar.gz" .
          ls -lh "zhange-stats-${VERSION}-static.tar.gz"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            zhange-stats-${{ steps.meta.outputs.version }}-static.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
