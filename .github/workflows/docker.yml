name: Build and push Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空则用 latest；打正式版请 push v* 标签）"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME,,}"
          SHA_SHORT="${GITHUB_SHA::7}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="${FILE_VERSION}"
            TAGS="${IMAGE}:latest,${IMAGE}:sha-${SHA_SHORT}"
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH="${GITHUB_REF_NAME,,}"
            BRANCH="${BRANCH//\//-}"
            BRANCH="$(echo "${BRANCH}" | sed 's/[^a-z0-9._-]/-/g')"
            VERSION="${FILE_VERSION}"
            TAGS="${IMAGE}:${BRANCH},${IMAGE}:sha-${SHA_SHORT}"
          else
            VERSION="${FILE_VERSION}"
            INPUT_TAG="${{ inputs.tag }}"
            TAG="${INPUT_TAG:-latest}"
            TAGS="${IMAGE}:${TAG},${IMAGE}:sha-${SHA_SHORT}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"
          echo "Resolved tags=${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
