name: Build and push Docker image

# 只在 main 推送时构建一次：镜像同时打 VERSION 与 latest（不再因 v* 标签重复构建）
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & lint & test & build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run test
          npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install & test
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Export OpenAPI & check drift
        env:
          DATABASE_URL: "mysql+pymysql://ci:ci@127.0.0.1:3306/ci"
          SECRET_KEY: "ci-openapi-drift-check-not-for-prod-use-only"
          ADMIN_PASSWORD: "ci-strong-password-9"
        run: |
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci --legacy-peer-deps && cd ..
          python backend/scripts/export_openapi.py
          cd frontend && npm run gen:api
          git diff --exit-code -- frontend/src/api/generated/openapi.json frontend/src/api/generated/schema.d.ts

  build-and-push:
    needs: [frontend-quality, backend-tests, openapi-drift]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME,,}"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "${VERSION}" ]]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"
          echo "Resolved tags=${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
